name: API CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/psic_clinic_specialty_stage_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/psic_clinic_specialty_stage_test
      JWT_ACCESS_SECRET: ci-only-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-for-production
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: psic_clinic_specialty_stage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d psic_clinic_specialty_stage_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Verify patient-team migration upgrade
        run: npm run prisma:verify-patient-team-migration

      - name: Verify master-role migration upgrade
        run: npm run prisma:verify-master-role-migration

      - name: Verify clinic role permission migration upgrade
        run: npm run prisma:verify-platform-role-permissions

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Synchronize disposable test schema
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build
